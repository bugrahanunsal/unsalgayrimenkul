<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0A2A5E"/>
  <!-- House silhouette: roof triangle + body rectangle with door -->
  <g fill="#F49B1C" stroke="#F49B1C" stroke-linejoin="round" stroke-linecap="round">
    <!-- Roof -->
    <path d="M 22 48 L 50 24 L 78 48 L 78 54 L 50 32 L 22 54 Z"/>
    <!-- Body/walls -->
    <path d="M 28 48 L 28 78 L 72 78 L 72 48 L 50 30 Z" fill="#F49B1C"/>
    <!-- Door -->
    <rect x="44" y="60" width="12" height="18" rx="1" fill="#0A2A5E"/>
    <!-- Windows -->
    <rect x="34" y="52" width="8" height="6" rx="0.5" fill="#0A2A5E"/>
    <rect x="58" y="52" width="8" height="6" rx="0.5" fill="#0A2A5E"/>
    <!-- Chimney -->
    <rect x="62" y="30" width="6" height="10" fill="#F49B1C"/>
  </g>
</svg>
