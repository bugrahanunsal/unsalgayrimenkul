<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>İlanlar - Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/admin-icon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/admin/assets/admin-icon-32.png?v=2">
  <link rel="apple-touch-icon" href="/admin/assets/admin-icon-180.png?v=2">
  <meta name="theme-color" content="#0A2A5E">
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20261016-ga">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">İlan Yönetimi</h1>
        <div class="topbar-actions">
          <a href="/admin/property-new.html" class="btn btn-primary btn-sm"><i class="ic ic-plus" aria-hidden="true"></i> Yeni İlan</a>
          <div class="user-menu" id="userMenu"></div>
        </div>
      </header>

      <div class="page-content">
        <!-- Filters -->
        <div class="card" style="margin-bottom: 20px;">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Arama</label>
              <input type="text" id="searchInput" class="form-input" placeholder="Başlık ara...">
            </div>
            <div class="form-group">
              <label class="form-label">Tip</label>
              <select id="filterTip" class="form-select">
                <option value="">Tümü</option>
                <option value="satilik">Satılık</option>
                <option value="kiralik">Kiralık</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Kategori</label>
              <select id="filterKategori" class="form-select">
                <option value="">Tümü</option>
                <option value="daire">Daire</option>
                <option value="villa">Villa</option>
                <option value="arsa">Arsa</option>
                <option value="mustakil_ev">Müstakil Ev</option>
                <option value="isyeri">İşyeri</option>
                <option value="yazlik">Yazlık</option>
                <option value="tarla">Tarla</option>
                <option value="bina">Bina</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Durum</label>
              <select id="filterDurum" class="form-select">
                <option value="">Tümü</option>
                <option value="aktif">Aktif</option>
                <option value="pasif">Pasif</option>
                <option value="satildi">Satıldı</option>
                <option value="kiralandi">Kiralandı</option>
                <option value="taslak">Taslak</option>
              </select>
            </div>
          </div>
        </div>

        <!-- İlanlar Tablosu -->
        <div class="table-container">
          <table class="table prop-table">
            <thead>
              <tr>
                <th class="c-foto">Foto</th>
                <th class="c-baslik">Başlık</th>
                <th class="c-kat">Kategori</th>
                <th class="c-konum">Konum</th>
                <th class="c-fiyat">Fiyat</th>
                <th class="c-goruntu">Görüntülenme</th>
                <th class="c-durum">Durum</th>
                <th class="c-islem">İşlemler</th>
              </tr>
            </thead>
            <tbody id="propertiesTable">
              <tr><td colspan="8" class="loading">Yükleniyor...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/assets/supabase-config.js?v=20260929-of"></script>
  <script src="/admin/assets/security.js?v=20261002-spam"></script>
  <script src="/admin/assets/auth.js?v=20261016-ga3"></script>
  <script src="/admin/assets/app.js?v=20261016-ga"></script>

  <script>
    let allProperties = [];
    let filteredProperties = [];
    const KAT_AD = { daire: 'Daire', villa: 'Villa', arsa: 'Arsa', mustakil_ev: 'Müstakil Ev', isyeri: 'İşyeri', yazlik: 'Yazlık', tarla: 'Tarla', bina: 'Bina' };
    const TIP_AD = { satilik: 'Satılık', kiralik: 'Kiralık' };
    const DURUM_AD = { aktif: 'Aktif', pasif: 'Pasif', satildi: 'Satıldı', kiralandi: 'Kiralandı', taslak: 'Taslak' };

    (async () => {
      const authed = await App.init('properties');
      if (!authed) return;

      await loadProperties();
      setupFilters();
    })();


    async function toggleOzelFirsat(id) {
      const p = (typeof allProperties !== 'undefined' ? allProperties : properties).find(x => x.id === id);
      if (!p) return;
      try {
        if (!p.ozel_firsat) {
          const other = await App.findOzelFirsat(id);
          if (other) { App.toast(App.ozelFirsatError(other), 'error', 'Özel Fırsat'); return; }
          if (p.durum !== 'aktif' && !(await App.confirm('Bu ilan aktif değil; aktif olana kadar ana sayfada görünmez. Yine de özel fırsat yapılsın mı?'))) return;
        }
        const { error } = await supabaseClient.from('properties').update({ ozel_firsat: !p.ozel_firsat }).eq('id', id);
        if (error) throw error;
        App.toast(p.ozel_firsat ? 'Özel Fırsat vitrininden kaldırıldı' : 'Ana sayfada Özel Fırsat olarak gösteriliyor', 'success');
        await loadProperties();
      } catch (e) {
        App.toast(/ozel_firsat_tek|duplicate key/i.test(e.message || '') ? 'Özel Fırsat zaten başka bir ilanda seçili.' : e.message, 'error');
      }
    }
    window.toggleOzelFirsat = toggleOzelFirsat;

    async function loadProperties() {
      try {
        const { data, error } = await supabaseClient
          .from('properties')
          .select('*, property_images(url, ana_foto)')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allProperties = data || [];
        filteredProperties = allProperties;
        renderTable();
      } catch (error) {
        console.error('Load error:', error);
        document.getElementById('propertiesTable').innerHTML =
          '<tr><td colspan="8"><div class="alert alert-error">Yükleme hatası: ' + Security.escapeHtml(error.message) + '</div></td></tr>';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('propertiesTable');

      if (filteredProperties.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="8">
            <div class="empty-state">
              <div class="empty-icon"><i class="ic ic-home" aria-hidden="true"></i></div>
              <div>Henüz ilan yok veya filtreye uygun sonuç bulunamadı</div>
              <a href="/admin/property-new.html" class="btn btn-primary btn-sm" style="margin-top: 16px;">İlk İlanı Ekle</a>
            </div>
          </td></tr>
        `;
        return;
      }

      tbody.innerHTML = filteredProperties.map(p => {
        const mainPhoto = p.property_images?.find(i => i.ana_foto)?.url
          || p.property_images?.[0]?.url;
        // Her ilanın düzenleme sayfası: başlık, fotoğraf ve "Düzenle" butonu buraya gider
        const editUrl = '/admin/property-edit.html?id=' + encodeURIComponent(p.id);
        const title = Security.escapeHtml(p.baslik_tr || 'İsimsiz');

        return `
          <tr>
            <td class="c-foto">
              <a href="${editUrl}" class="prop-thumb" tabindex="-1" aria-hidden="true">${mainPhoto
                ? `<img src="${Security.escapeHtml(mainPhoto)}" alt="">`
                : '<span class="prop-thumb-empty"><i class="ic ic-home" aria-hidden="true"></i></span>'
              }</a>
            </td>
            <td class="c-baslik">
              ${p.ozel_firsat ? '<div style="margin-bottom:4px;"><span class="badge badge-info" title="Ana sayfa Özel Fırsat vitrini"><i class="ic ic-gem" aria-hidden="true"></i> ÖZEL FIRSAT</span></div>' : ''}<a href="${editUrl}" class="prop-title" title="Düzenlemek için tıklayın">${title}</a>
              <div class="prop-sub">${[p.m2 ? Security.escapeHtml(p.m2) + ' m²' : '', Security.escapeHtml(p.oda_sayisi || '')].filter(Boolean).join(' • ')}</div>
              <a href="${editUrl}" class="btn btn-sm btn-duzenle prop-edit-top"><i class="ic ic-edit" aria-hidden="true"></i> Düzenle</a>
            </td>
            <td class="c-kat">
              <span class="badge badge-info">${Security.escapeHtml(KAT_AD[p.kategori] || p.kategori)}</span>
              <div class="prop-tip">${Security.escapeHtml(TIP_AD[p.tip] || p.tip)}</div>
            </td>
            <td class="c-konum">${Security.escapeHtml(p.ilce || '-')}</td>
            <td class="c-fiyat">
              ${App.formatPrice(p.fiyat, p.para_birimi)}
            </td>
            <td class="c-goruntu">${(p.goruntulenme || 0).toLocaleString('tr-TR')}</td>
            <td class="c-durum">
              <span class="badge badge-${getStatusColor(p.durum)}">
                ${Security.escapeHtml(DURUM_AD[p.durum] || p.durum)}
              </span>
            </td>
            <td class="c-islem"><div class="row-actions">
              <a href="${editUrl}" class="btn btn-duzenle prop-edit-bottom"><i class="ic ic-edit" aria-hidden="true"></i> Düzenle</a>
              ${p.durum === 'aktif' ? `<a href="${Security.escapeHtml(p.slug && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(p.slug) ? '/ilan/' + p.slug : '/ilan?id=' + encodeURIComponent(p.id))}" target="_blank" rel="noopener" class="btn btn-outline btn-sm btn-icon" title="İlan sayfasını sitede aç" aria-label="İlan sayfasını sitede aç"><i class="ic ic-external" aria-hidden="true"></i></a>` : ''}
              <button onclick="toggleOzelFirsat('${p.id}')" class="btn ${p.ozel_firsat ? 'btn-primary' : 'btn-outline'} btn-sm btn-icon" title="${p.ozel_firsat ? 'Özel Fırsat vitrininden kaldır' : 'Ana sayfada Özel Fırsat yap'}" aria-label="Özel Fırsat"><i class="ic ic-gem" aria-hidden="true"></i></button>
              ${p.durum === 'aktif' ? `<button onclick="App.announceProperty('${p.id}')" class="btn btn-outline btn-sm btn-icon" title="İlgi alanı uyan abonelere e-posta ile duyur" aria-label="Abonelere duyur"><i class="ic ic-megaphone" aria-hidden="true"></i></button>` : ''}
              <button onclick="deleteProperty('${p.id}')" class="btn btn-outline-danger btn-sm btn-icon" title="Sil" aria-label="Sil"><i class="ic ic-trash" aria-hidden="true"></i></button>
            </div></td>
          </tr>
        `;
      }).join('');
    }

    function getStatusColor(status) {
      const map = {
        'aktif': 'success',
        'pasif': 'gray',
        'satildi': 'info',
        'kiralandi': 'info',
        'taslak': 'warning'
      };
      return map[status] || 'gray';
    }

    function setupFilters() {
      const filters = ['searchInput', 'filterTip', 'filterKategori', 'filterDurum'];
      filters.forEach(id => {
        document.getElementById(id).addEventListener('input', applyFilters);
        document.getElementById(id).addEventListener('change', applyFilters);
      });
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const tip = document.getElementById('filterTip').value;
      const kategori = document.getElementById('filterKategori').value;
      const durum = document.getElementById('filterDurum').value;

      filteredProperties = allProperties.filter(p => {
        if (search && !(p.baslik_tr || '').toLowerCase().includes(search)) return false;
        if (tip && p.tip !== tip) return false;
        if (kategori && p.kategori !== kategori) return false;
        if (durum && p.durum !== durum) return false;
        return true;
      });

      renderTable();
    }

    async function deleteProperty(id) {
      const confirmed = await App.confirm(
        'Bu ilanı silmek istediğinize emin misiniz?\n\nBu işlem geri alınamaz!',
        'İlan Silme'
      );
      if (!confirmed) return;

      try {
        const { error } = await supabaseClient
          .from('properties')
          .delete()
          .eq('id', id);

        if (error) throw error;

        App.toast('İlan silindi', 'success', 'Başarılı');
        await loadProperties();
      } catch (error) {
        console.error('Delete error:', error);
        App.toast(error.message, 'error', 'Hata');
      }
    }

    window.deleteProperty = deleteProperty;
  </script>
</body>
</html>
