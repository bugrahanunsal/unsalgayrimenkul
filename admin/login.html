<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Giriş - İsmail Ünsal Gayrimenkul</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta http-equiv="refresh" content="0; url=/?login=1">
  <script>
    // Anında ana siteye yönlendir - login modal orada açılsın
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason') || '';
    const redirect = params.get('redirect') || '/admin/index.html';

    // Ana siteye ?login=1 parametresi ile git, modal orada açılacak
    const target = '/?login=1&redirect=' + encodeURIComponent(redirect);
    window.location.replace(target);
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 14px;
      opacity: 0.8;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Ana sayfaya yönlendiriliyorsunuz...</p>
    <p style="margin-top: 8px; font-size: 12px;"><a href="/?login=1">Yönlendirmezse tıklayın</a></p>
  </div>
</body>
</html>
