<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Email Kampanyaları - Admin Panel</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .campaign-preview {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    .property-selector {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .prop-check-card {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .prop-check-card:hover { border-color: var(--accent); }
    .prop-check-card.selected { border-color: var(--accent); background: #fef7e9; }
    .send-summary {
      background: linear-gradient(135deg, #0a1929, #1a3a5f);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">📨 Email Kampanyaları</h1>
        <div class="topbar-actions">
          <button onclick="openNewCampaign()" class="btn btn-primary btn-sm">➕ Yeni Kampanya</button>
          <div class="user-menu" id="userMenu"></div>
        </div>
      </header>

      <div class="page-content">
        <!-- Aktif abone sayısı özeti -->
        <div id="summaryBar"></div>

        <!-- Kampanya listesi -->
        <div id="campaignsList"><div class="loading">Yükleniyor...</div></div>
      </div>
    </main>
  </div>

  <!-- Yeni Kampanya Modal -->
  <div id="newCampaignModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: white; border-radius: var(--radius-lg); max-width: 1000px; width: 100%; max-height: 90vh; overflow-y: auto;">
      <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 18px; font-weight: 700;">📨 Yeni Email Kampanyası</div>
        <button onclick="closeNewCampaign()" style="background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
      </div>

      <form id="campaignForm" style="padding: 20px;">
        <div class="form-group">
          <label class="form-label">Kampanya Tipi *</label>
          <select id="campaignType" class="form-select" required>
            <option value="weekly_digest">📅 Haftalık Bülten (yeni ilanlar)</option>
            <option value="new_property">🏠 Yeni İlan Duyurusu</option>
            <option value="manual">✏️ Manuel/Özel</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Konu Başlığı *</label>
            <input type="text" id="campaignSubject" class="form-input" required maxlength="200" placeholder="Örn: Bu Hafta Yalova'da 5 Yeni Fırsat!">
          </div>
          <div class="form-group">
            <label class="form-label">Hedef Dil</label>
            <select id="targetLang" class="form-select">
              <option value="">🌍 Tüm Diller</option>
              <option value="tr" selected>🇹🇷 Sadece Türkçe</option>
              <option value="en">🇬🇧 Sadece İngilizce</option>
              <option value="de">🇩🇪 Sadece Almanca</option>
              <option value="fr">🇫🇷 Sadece Fransızca</option>
              <option value="ru">🇷🇺 Sadece Rusça</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Kampanyaya Eklenecek İlanlar (en fazla 6) *</label>
          <div id="propertySelector" class="property-selector">
            <div class="loading">Yükleniyor...</div>
          </div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
            Seçili: <span id="selectedCount">0</span> ilan
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Özel Mesaj (opsiyonel)</label>
          <textarea id="customMessage" class="form-textarea" maxlength="500" placeholder="Örn: Bu hafta özellikle yatırımlık arsalar öne çıkıyor..."></textarea>
        </div>

        <!-- Alıcı özeti -->
        <div class="send-summary" id="sendSummary">
          <div style="font-size: 14px; opacity: 0.8;">Bu kampanya gönderilecek:</div>
          <div style="font-size: 32px; font-weight: 700; margin: 4px 0;" id="recipientCount">-</div>
          <div style="font-size: 13px; opacity: 0.8;">aktif ve doğrulanmış aboneye</div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" onclick="closeNewCampaign()" class="btn btn-outline">İptal</button>
          <button type="button" onclick="previewCampaign()" class="btn btn-outline">👁️ Önizle</button>
          <button type="submit" class="btn btn-primary" id="sendBtn">📨 Gönder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Preview Modal -->
  <div id="previewModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1001; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: white; border-radius: var(--radius-lg); max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto;">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 16px; font-weight: 700;">👁️ Email Önizleme</div>
        <button onclick="closePreview()" style="background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
      </div>
      <iframe id="previewFrame" style="width: 100%; height: 600px; border: none;"></iframe>
    </div>
  </div>

  <script src="/admin/assets/supabase-config.js"></script>
  <script src="/admin/assets/security.js"></script>
  <script src="/admin/assets/auth.js"></script>
  <script src="/admin/assets/app.js"></script>
  <script src="/admin/assets/email-template.js"></script>

  <script>
    let campaigns = [];
    let activeProperties = [];
    let selectedPropertyIds = new Set();
    let activeSubscriberCount = 0;

    (async () => {
      const authed = await App.init('campaigns');
      if (!authed) return;

      await loadSummary();
      await loadCampaigns();

      document.getElementById('targetLang').addEventListener('change', updateRecipientCount);
    })();

    async function loadSummary() {
      try {
        const { data, error } = await supabaseClient
          .from('subscriber_stats')
          .select('*')
          .single();

        if (error) throw error;
        activeSubscriberCount = data.verified_count;

        document.getElementById('summaryBar').innerHTML = `
          <div class="stat-row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px;">
            <div class="stat-card">
              <div class="stat-label">Aktif Alıcı</div>
              <div class="stat-value">${data.verified_count.toLocaleString('tr-TR')}</div>
              <div class="stat-change positive">📧 Email alacaklar</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Gönderilen Kampanya</div>
              <div class="stat-value" id="campaignTotalCount">-</div>
              <div class="stat-change">📨 Toplam</div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error(error);
      }
    }

    async function loadCampaigns() {
      try {
        const { data, error } = await supabaseClient
          .from('email_campaigns')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        campaigns = data || [];

        const countEl = document.getElementById('campaignTotalCount');
        if (countEl) countEl.textContent = campaigns.filter(c => c.status === 'sent').length;

        renderCampaigns();
      } catch (error) {
        document.getElementById('campaignsList').innerHTML =
          '<div class="alert alert-error">' + Security.escapeHtml(error.message) + '</div>';
      }
    }

    function renderCampaigns() {
      const container = document.getElementById('campaignsList');

      if (campaigns.length === 0) {
        container.innerHTML = `
          <div class="card">
            <div class="empty-state">
              <div class="empty-icon">📨</div>
              <div>Henüz kampanya gönderilmemiş</div>
              <button onclick="openNewCampaign()" class="btn btn-primary btn-sm" style="margin-top: 16px;">İlk Kampanyayı Oluştur</button>
            </div>
          </div>
        `;
        return;
      }

      const statusBadges = {
        draft: '<span class="badge badge-gray">📝 Taslak</span>',
        scheduled: '<span class="badge badge-warning">⏰ Zamanlanmış</span>',
        sending: '<span class="badge badge-warning">📤 Gönderiliyor</span>',
        sent: '<span class="badge badge-success">✅ Gönderildi</span>',
        failed: '<span class="badge badge-danger">❌ Başarısız</span>'
      };

      container.innerHTML = `
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Konu</th>
                <th>Tip</th>
                <th>Gönderilen</th>
                <th>Açılan</th>
                <th>Tarih</th>
                <th>Durum</th>
              </tr>
            </thead>
            <tbody>
              ${campaigns.map(c => `
                <tr>
                  <td>
                    <div style="font-weight: 600;">${Security.escapeHtml(c.subject)}</div>
                    ${c.target_language ? `<div style="font-size: 12px; color: var(--text-muted);">Dil: ${c.target_language.toUpperCase()}</div>` : ''}
                  </td>
                  <td>${Security.escapeHtml(c.campaign_type)}</td>
                  <td>${(c.sent_to_count || 0).toLocaleString('tr-TR')}</td>
                  <td>
                    ${c.opened_count || 0}
                    ${c.sent_to_count > 0 ? `<div style="font-size: 11px; color: var(--text-muted);">${((c.opened_count / c.sent_to_count) * 100).toFixed(1)}%</div>` : ''}
                  </td>
                  <td>${c.sent_at ? App.formatDate(c.sent_at) : App.formatDate(c.created_at)}</td>
                  <td>${statusBadges[c.status] || c.status}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function openNewCampaign() {
      document.getElementById('newCampaignModal').style.display = 'flex';
      selectedPropertyIds.clear();
      document.getElementById('selectedCount').textContent = '0';

      // Aktif ilanları yükle
      try {
        const { data, error } = await supabaseClient
          .from('properties')
          .select('id, baslik_tr, kategori, fiyat, tip')
          .eq('durum', 'aktif')
          .order('created_at', { ascending: false })
          .limit(30);

        if (error) throw error;
        activeProperties = data || [];
        renderPropertySelector();
      } catch (error) {
        App.toast(error.message, 'error');
      }

      updateRecipientCount();
    }
    window.openNewCampaign = openNewCampaign;

    function renderPropertySelector() {
      const container = document.getElementById('propertySelector');
      if (activeProperties.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); padding: 20px; text-align: center;">Aktif ilan yok</div>';
        return;
      }

      container.innerHTML = activeProperties.map(p => `
        <div class="prop-check-card" data-id="${p.id}" onclick="togglePropertySelect('${p.id}')">
          <div style="font-weight: 600; font-size: 13px; margin-bottom: 4px;">${Security.escapeHtml(p.baslik_tr)}</div>
          <div style="font-size: 12px; color: var(--text-muted);">${Security.escapeHtml(p.kategori || '')} • ${p.tip || ''}</div>
          <div style="font-weight: 700; color: var(--accent-dark); margin-top: 4px;">${App.formatPrice(p.fiyat)}</div>
        </div>
      `).join('');
    }

    function togglePropertySelect(id) {
      const card = document.querySelector(`.prop-check-card[data-id="${id}"]`);
      if (selectedPropertyIds.has(id)) {
        selectedPropertyIds.delete(id);
        card.classList.remove('selected');
      } else {
        if (selectedPropertyIds.size >= 6) {
          App.toast('En fazla 6 ilan seçebilirsiniz', 'warning');
          return;
        }
        selectedPropertyIds.add(id);
        card.classList.add('selected');
      }
      document.getElementById('selectedCount').textContent = selectedPropertyIds.size;
    }
    window.togglePropertySelect = togglePropertySelect;

    async function updateRecipientCount() {
      const lang = document.getElementById('targetLang').value;
      try {
        let query = supabaseClient
          .from('subscribers')
          .select('id', { count: 'exact', head: true })
          .eq('is_active', true)
          .eq('email_verified', true);

        if (lang) query = query.eq('language', lang);

        const { count, error } = await query;
        if (error) throw error;

        document.getElementById('recipientCount').textContent = (count || 0).toLocaleString('tr-TR');
      } catch (error) {
        document.getElementById('recipientCount').textContent = '?';
      }
    }

    function closeNewCampaign() {
      document.getElementById('newCampaignModal').style.display = 'none';
    }
    window.closeNewCampaign = closeNewCampaign;

    async function previewCampaign() {
      if (selectedPropertyIds.size === 0) {
        App.toast('En az 1 ilan seçin', 'warning');
        return;
      }

      const props = activeProperties.filter(p => selectedPropertyIds.has(p.id));
      const { data: fullProps } = await supabaseClient
        .from('properties')
        .select('*, property_images(url, is_main)')
        .in('id', props.map(p => p.id));

      const subject = document.getElementById('campaignSubject').value || 'Örnek Konu';
      const customMsg = document.getElementById('customMessage').value;
      const lang = document.getElementById('targetLang').value || 'tr';

      const html = EmailTemplate.build({
        subject,
        language: lang,
        properties: fullProps,
        customMessage: customMsg,
        unsubscribeToken: 'PREVIEW-TOKEN-XXXX'
      });

      const frame = document.getElementById('previewFrame');
      frame.srcdoc = html;
      document.getElementById('previewModal').style.display = 'flex';
    }
    window.previewCampaign = previewCampaign;

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }
    window.closePreview = closePreview;

    document.getElementById('campaignForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (selectedPropertyIds.size === 0) {
        App.toast('En az 1 ilan seçmelisiniz', 'warning');
        return;
      }

      const confirmed = await App.confirm(
        `Bu kampanya ${document.getElementById('recipientCount').textContent} kişiye gönderilecek. Emin misiniz?`
      );
      if (!confirmed) return;

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Gönderiliyor...';

      try {
        const subject = Security.sanitizeInput(document.getElementById('campaignSubject').value, { maxLength: 200 });
        const customMsg = Security.sanitizeInput(document.getElementById('customMessage').value, { maxLength: 500 });
        const lang = document.getElementById('targetLang').value || null;
        const campaignType = document.getElementById('campaignType').value;

        // 1. Kampanya kaydı oluştur (draft)
        const { data: campaign, error: cErr } = await supabaseClient
          .from('email_campaigns')
          .insert({
            subject,
            campaign_type: campaignType,
            target_language: lang,
            property_ids: Array.from(selectedPropertyIds),
            status: 'sending',
            created_by_id: App.currentUser.id
          })
          .select()
          .single();

        if (cErr) throw cErr;

        // 2. Edge Function'ı çağır
        const { data: session } = await supabaseClient.auth.getSession();
        const response = await fetch(`${SUPABASE_URL}/functions/v1/send-newsletter`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.session.access_token}`
          },
          body: JSON.stringify({
            campaignId: campaign.id,
            subject,
            language: lang,
            propertyIds: Array.from(selectedPropertyIds),
            customMessage: customMsg
          })
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error('Email gönderilemedi: ' + err);
        }

        const result = await response.json();

        await Security.logSecurityEvent('campaign_sent', {
          campaign_id: campaign.id,
          recipient_count: result.sentCount
        }, 'info');

        App.toast(`✅ ${result.sentCount} kişiye gönderildi!`, 'success');
        closeNewCampaign();
        await loadCampaigns();

      } catch (error) {
        App.toast(error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '📨 Gönder';
      }
    });
  </script>
</body>
</html>
