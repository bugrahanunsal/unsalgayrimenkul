<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mesajlar - Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/admin-icon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/admin/assets/admin-icon-32.png?v=2">
  <link rel="apple-touch-icon" href="/admin/assets/admin-icon-180.png?v=2">
  <meta name="theme-color" content="#0A2A5E">
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20261002-btn">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">Müşteri Mesajları</h1>
        <div class="topbar-actions">
          <div class="user-menu" id="userMenu"></div>
        </div>
      </header>

      <div class="page-content">
        <!-- Filter -->
        <div class="card" style="margin-bottom: 20px;">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Durum</label>
              <select id="filterDurum" class="form-select">
                <option value="">Tümü</option>
                <option value="yeni">Yeni</option>
                <option value="aranildi">Arandı</option>
                <option value="gorusme">Görüşme Yapılıyor</option>
                <option value="satildi">Satıldı</option>
                <option value="takip">Takip</option>
                <option value="spam">Spam</option>
                <option value="kapali">Kapalı</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Arama</label>
              <input type="text" id="searchInput" class="form-input" placeholder="İsim, telefon...">
            </div>
          </div>
        </div>

        <!-- Mesajlar -->
        <div id="leadsList">
          <div class="loading">Yükleniyor...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/assets/supabase-config.js?v=20260929-of"></script>
  <script src="/admin/assets/security.js?v=20260929-of"></script>
  <script src="/admin/assets/auth.js?v=20260929-of"></script>
  <script src="/admin/assets/app.js?v=20261002-btn"></script>

  <script>
    let allLeads = [];

    (async () => {
      const authed = await App.init('leads');
      if (!authed) return;

      await loadLeads();
      setupFilters();
    })();

    async function loadLeads() {
      try {
        const { data, error } = await supabaseClient
          .from('leads')
          .select('*, properties(baslik_tr, fiyat, para_birimi)')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allLeads = data || [];
        renderLeads(allLeads);
      } catch (error) {
        console.error('Load error:', error);
        const box = document.getElementById('leadsList');
        box.textContent = '';
        const a = document.createElement('div');
        a.className = 'alert alert-error';
        a.textContent = 'Yükleme hatası: ' + (error && error.message ? error.message : String(error));
        box.appendChild(a);
      }
    }

    const DURUM = { yeni: 'Yeni', aranildi: 'Arandı', gorusme: 'Görüşme yapılıyor', satildi: 'Satıldı', takip: 'Takip', spam: 'Spam', kapali: 'Kapalı' };
    const EMAIL_RE = /^[^\s@<>"'()]+@[^\s@<>"'()]+\.[^\s@<>"'()]+$/;

    // Ziyaretçiden gelen her şey textContent ile yazılır (HTML olarak yorumlanmaz)
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = String(text);
      return n;
    }
    function iconText(tag, cls, icon, text) {
      const n = el(tag, cls);
      n.appendChild(App.icon(icon));
      n.appendChild(el('span', null, text));
      return n;
    }
    function infoItem(label, valueNode) {
      const d = el('div', 'lead-field');
      d.appendChild(el('div', 'lead-k', label));
      valueNode.classList.add('lead-v');
      d.appendChild(valueNode);
      return d;
    }

    function leadCard(l) {
      const card = el('article', 'card lead-card' + (l.durum === 'yeni' ? ' is-new' : ''));
      card.dataset.id = String(l.id);

      // Başlık: isim + zaman | durum
      const head = el('div', 'lead-head');
      const who = el('div', 'lead-who');
      who.appendChild(el('div', 'lead-name', l.isim || 'İsimsiz'));
      const when = el('div', 'lead-when');
      when.appendChild(App.icon('calendar'));
      when.appendChild(el('span', null, App.timeAgo(l.created_at) + ' · ' + App.formatDate(l.created_at, true)));
      who.appendChild(when);
      head.appendChild(who);
      const sel = el('select', 'form-select form-select-sm lead-status');
      sel.dataset.act = 'status';
      sel.setAttribute('aria-label', 'Durum');
      Object.keys(DURUM).forEach(k => { const o = el('option', null, DURUM[k]); o.value = k; if (l.durum === k) o.selected = true; sel.appendChild(o); });
      if (l.durum && !DURUM[l.durum]) { const o = el('option', null, l.durum); o.value = l.durum; o.selected = true; sel.appendChild(o); }
      head.appendChild(sel);
      card.appendChild(head);

      // Bilgiler
      const tel = String(l.telefon || '').trim();
      const telDigits = tel.replace(/[^\d+]/g, '');
      const mail = String(l.email || '').trim();
      const mailOk = EMAIL_RE.test(mail);
      const info = el('div', 'lead-info');
      if (tel) { const a = iconText('a', null, 'phone', tel); if (telDigits) a.href = 'tel:' + telDigits; info.appendChild(infoItem('Telefon', a)); }
      if (mail) { const a = iconText(mailOk ? 'a' : 'span', null, 'mail', mail); if (mailOk) a.href = 'mailto:' + mail; info.appendChild(infoItem('E-posta', a)); }
      if (l.properties && l.properties.baslik_tr) info.appendChild(infoItem('İlgili ilan', iconText('span', null, 'home', l.properties.baslik_tr)));
      if (info.childElementCount) card.appendChild(info);

      if (l.mesaj) {
        const m = el('div', 'lead-msg');
        m.appendChild(el('div', 'lead-k', 'Mesaj'));
        m.appendChild(el('div', 'lead-msg-t', l.mesaj));
        card.appendChild(m);
      }

      // İşlemler: hepsi aynı boyda; tek ana işlem (İlan Gönder), silme sağda ve sakin
      const acts = el('div', 'lead-actions');
      const main = el('div', 'lead-actions-main');
      if (telDigits) {
        const call = iconText('a', 'btn btn-outline btn-sm', 'phone', 'Ara'); call.href = 'tel:' + telDigits; main.appendChild(call);
        const wa = iconText('a', 'btn btn-outline btn-sm', 'message', 'WhatsApp');
        wa.href = 'https://wa.me/' + telDigits.replace(/\D/g, ''); wa.target = '_blank'; wa.rel = 'noopener noreferrer'; main.appendChild(wa);
      }
      if (mailOk) {
        const em = iconText('a', 'btn btn-outline btn-sm', 'mail', 'E-posta'); em.href = 'mailto:' + mail; main.appendChild(em);
        const send = iconText('a', 'btn btn-primary btn-sm', 'send', 'İlan Gönder'); send.href = '/admin/ilan-gonder.html?lead=' + encodeURIComponent(l.id); main.appendChild(send);
      }
      acts.appendChild(main);
      const del = iconText('button', 'btn btn-outline-danger btn-sm lead-del', 'trash', 'Sil');
      del.type = 'button'; del.dataset.act = 'delete';
      acts.appendChild(del);
      card.appendChild(acts);
      return card;
    }

    function renderLeads(leads) {
      const container = document.getElementById('leadsList');
      container.textContent = '';
      if (leads.length === 0) {
        const c = el('div', 'card');
        const e = el('div', 'empty-state');
        const ic = el('div', 'empty-icon'); ic.appendChild(App.icon('message'));
        e.appendChild(ic);
        e.appendChild(el('div', null, allLeads.length ? 'Bu filtreye uyan mesaj yok' : 'Henüz mesaj yok'));
        c.appendChild(e);
        container.appendChild(c);
        return;
      }
      leads.forEach(l => container.appendChild(leadCard(l)));
    }

    async function updateStatus(id, newStatus) {
      if (!Object.prototype.hasOwnProperty.call(DURUM, newStatus)) return;
      try {
        const { error } = await supabaseClient
          .from('leads')
          .update({ durum: newStatus })
          .eq('id', id);

        if (error) throw error;
        App.toast('Durum güncellendi', 'success');
        await loadLeads();
        App.updateLeadsBadge();
      } catch (error) {
        console.error(error);
        App.toast(error.message, 'error');
      }
    }

    async function deleteLead(id) {
      const confirmed = await App.confirm('Bu mesajı silmek istediğinize emin misiniz?');
      if (!confirmed) return;

      try {
        const { error } = await supabaseClient
          .from('leads')
          .delete()
          .eq('id', id);

        if (error) throw error;
        App.toast('Mesaj silindi', 'success');
        await loadLeads();
        App.updateLeadsBadge();
      } catch (error) {
        App.toast(error.message, 'error');
      }
    }

    // Satır içi onclick/onchange yok: kartlardaki işlemler tek yerden dinlenir
    const listEl = document.getElementById('leadsList');
    listEl.addEventListener('change', (e) => {
      const sel = e.target.closest('select[data-act="status"]');
      const card = sel && sel.closest('.lead-card');
      if (card) updateStatus(card.dataset.id, sel.value);
    });
    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act="delete"]');
      const card = btn && btn.closest('.lead-card');
      if (card) deleteLead(card.dataset.id);
    });

    function setupFilters() {
      document.getElementById('filterDurum').addEventListener('change', applyFilter);
      document.getElementById('searchInput').addEventListener('input', applyFilter);
    }

    function applyFilter() {
      const durum = document.getElementById('filterDurum').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allLeads.filter(l => {
        if (durum && l.durum !== durum) return false;
        if (search) {
          const text = `${l.isim} ${l.telefon} ${l.email} ${l.mesaj}`.toLowerCase();
          if (!text.includes(search)) return false;
        }
        return true;
      });

      renderLeads(filtered);
    }
  </script>
</body>
</html>
