<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>E-posta Tasarımları - Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/admin-icon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/admin/assets/admin-icon-32.png?v=2">
  <link rel="apple-touch-icon" href="/admin/assets/admin-icon-180.png?v=2">
  <meta name="theme-color" content="#0A2A5E">
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20261002-150kb">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .ed-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .ed-top .form-input,.ed-top .form-select{flex:1 1 200px;min-width:0;max-width:none;min-height:40px;padding-top:9px;padding-bottom:9px}
    .ed-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;margin-left:auto}
    .ed-sm{display:none}
    @media(max-width:640px){.ed-actions{width:100%;margin-left:0}.ed-actions .btn:not(.btn-icon){flex:1 1 auto;padding-left:10px;padding-right:10px;white-space:nowrap}.ed-lg{display:none}.ed-sm{display:inline}}
    .ed-grid{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:14px;align-items:start}
    @media(max-width:1280px){.ed-grid{grid-template-columns:250px minmax(0,1fr)}.ed-props{grid-column:1/-1}}
    @media(max-width:820px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
    .ed-pal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
    .ed-pal button{border:1.5px solid #E2E8F0;background:#fff;border-radius:10px;padding:10px 6px;font-size:12px;font-weight:700;color:#0A2A5E;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
    .ed-pal button:hover{border-color:#2563EB;background:#EFF6FF}
    .ed-pal b{font-size:18px}
    .ed-blocks{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
    .ed-b{display:flex;align-items:center;gap:6px;border:1.5px solid #E2E8F0;border-radius:10px;padding:8px;background:#fff;cursor:pointer;font-size:13px}
    .ed-b.sel{border-color:#2563EB;background:#EFF6FF}
    .ed-b.drag{opacity:.4}
    .ed-b .h{cursor:grab;color:#94A3B8;font-size:14px}
    .ed-b .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#1E293B}
    .ed-b button{border:0;background:transparent;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:5px}
    .ed-b button:hover{background:#E2E8F0}
    .ed-prev{padding:0;overflow:hidden}
    .ed-prevbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #E2E8F0;background:#F8FAFC;font-size:12px;color:#64748B;gap:8px}
    .ed-frame-wrap{background:#E2E8F0;display:flex;justify-content:center;padding:0}
    #pv{width:100%;height:78vh;border:0;background:#F1F5F9;transition:width .2s}
    #pv.mob{width:375px}
    .ed-props .form-group{margin-bottom:12px}
    .ed-props h3{font-size:15px;color:#0A2A5E;margin:0 0 12px}
    .ed-row{display:flex;gap:8px}.ed-row>*{flex:1}
    .ed-color{display:flex;align-items:center;gap:8px}.ed-color input[type=color]{width:42px;height:36px;border:1px solid #E2E8F0;border-radius:8px;padding:2px;background:#fff}
    .ed-plist{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;border:1px solid #E2E8F0;border-radius:10px;padding:6px}
    .ed-plist label{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px;border-radius:6px;cursor:pointer}
    .ed-plist label:hover{background:#F1F5F9}
    .ed-plist img{width:44px;height:32px;object-fit:cover;border-radius:4px;background:#E2E8F0}
    .ed-tip{font-size:12px;color:#64748B;line-height:1.5;background:#F8FAFC;border-radius:8px;padding:8px 10px;margin-top:8px}
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">E-posta Tasarımları</h1>
        <div class="topbar-actions"><a href="/admin/campaigns.html" class="btn btn-outline btn-sm"><i class="ic ic-send" aria-hidden="true"></i> Kampanyalar</a><div class="user-menu" id="userMenu"></div></div>
      </header>
      <div class="page-content">
        <div class="card ed-top">
          <select id="tplSel" class="form-select" aria-label="Kayıtlı tasarımlar"></select>
          <input id="tplName" class="form-input" maxlength="80" placeholder="Tasarım adı (örn. Ekim Bülteni)">
          <input id="tplSubject" class="form-input" maxlength="150" placeholder="Varsayılan e-posta konusu">
          <div class="ed-actions">
            <button type="button" class="btn btn-primary" id="saveBtn"><i class="ic ic-save" aria-hidden="true"></i> Kaydet</button>
            <button type="button" class="btn btn-outline" id="saveAsBtn" title="Kopya olarak kaydet"><i class="ic ic-copy" aria-hidden="true"></i> <span class="ed-lg">Kopya olarak kaydet</span><span class="ed-sm" aria-hidden="true">Kopya kaydet</span></button>
            <button type="button" class="btn btn-outline-danger btn-icon" id="delBtn" title="Sil" aria-label="Sil"><i class="ic ic-trash" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="ed-grid">
          <div class="card">
            <div class="form-label" style="margin-bottom:8px;"><i class="ic ic-plus" aria-hidden="true"></i> Blok ekle</div>
            <div class="ed-pal" id="palette"></div>
            <div class="form-label" style="margin:6px 0 8px;">Bloklar (sürükleyip sıralayın)</div>
            <div class="ed-blocks" id="blocks"></div>
          </div>
          <div class="card ed-prev">
            <div class="ed-prevbar"><span>Canlı önizleme · <b>{{ad}}</b> alıcının adıyla değişir</span><div><button type="button" class="btn btn-outline btn-sm" id="pvDesk" title="Masaüstü" aria-label="Masaüstü"><i class="ic ic-monitor" aria-hidden="true"></i></button> <button type="button" class="btn btn-outline btn-sm" id="pvMob" title="Mobil" aria-label="Mobil"><i class="ic ic-smartphone" aria-hidden="true"></i></button></div></div>
            <div class="ed-frame-wrap"><iframe id="pv" sandbox="allow-same-origin" title="E-posta önizleme"></iframe></div>
          </div>
          <div class="card ed-props" id="props"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="/admin/assets/supabase-config.js?v=20260929-of"></script>
  <script src="/admin/assets/security.js?v=20261002-spam"></script>
  <script src="/admin/assets/auth.js?v=20261002-spam"></script>
  <script src="/admin/assets/app.js?v=20261002-spam"></script>
  <script src="/cms-safe.js?v=20260929-of"></script>
  <script src="/admin/assets/rich-editor.js?v=20261002-40mb"></script>
  <script src="/admin/assets/email-render.js?v=20261001-medya"></script>
  <script src="/admin/assets/medya.js?v=20261002-150kb"></script>
  <script src="/admin/assets/email-tasarim.js?v=20261002-150kb"></script>
</body>
</html>
