<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Email Doğrulama - İsmail Ünsal Gayrimenkul</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a1929 0%, #1a3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    .logo {
      color: #3b82f6;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #6b7280;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .icon {
      font-size: 64px;
      margin: 20px 0;
      display: block;
    }
    h1 {
      font-size: 24px;
      color: #0a1929;
      margin-bottom: 12px;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .email {
      background: #f9fafb;
      padding: 12px 16px;
      border-radius: 8px;
      color: #0a1929;
      font-weight: 600;
      margin: 16px 0;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
      transition: all 0.15s;
    }
    .btn:hover { background: #b8912e; transform: translateY(-2px); }
    .btn-outline {
      background: transparent;
      color: #0a1929;
      border: 2px solid #e5e7eb;
    }
    .btn-outline:hover { border-color: #3b82f6; color: #3b82f6; background: transparent; }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      font-size: 12px;
    }
    .footer a { color: #3b82f6; text-decoration: none; }
  </style>
<script src="/translator.js?v=20260928-batch" defer></script>
<script src="/translations.js?v=20260928-cta" defer></script>
</head>
<body>
  <div class="card">
    <div class="logo">İSMAİL ÜNSAL</div>
    <div class="subtitle">GAYRİMENKUL DANIŞMANI</div>

    <div id="content">
      <div class="spinner"></div>
      <h1 style="margin-top: 20px;">Doğrulanıyor...</h1>
      <p>Lütfen bekleyin</p>
    </div>

    <div class="footer">
      © <span id="year"></span> İsmail Ünsal Gayrimenkul<br>
      <a href="https://ismailunsal.com.tr">ismailunsal.com.tr</a>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const SUPABASE_URL = 'https://gosmkthmamloafgtvhpj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_iTHuziWSB_dtIguKLcxIKw_zFeJeRW4';

    // Güvenlik: HTML escape
    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // URL'den token al
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const content = document.getElementById('content');

    if (!token || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
      content.innerHTML = `
        <span class="icon">❌</span>
        <h1>Geçersiz Link</h1>
        <p>Doğrulama linki geçersiz veya eksik. Lütfen emailinizdeki linke tıkladığınızdan emin olun.</p>
        <a href="https://ismailunsal.com.tr" class="btn">Ana Sayfaya Dön</a>
      `;
    } else {
      verifyToken(token);
    }

    async function verifyToken(t) {
      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: false }
        });

        const { data, error } = await supabase.rpc('verify_subscriber', { p_token: t });

        if (error) throw error;

        const result = data?.[0];

        if (result?.success) {
          content.innerHTML = `
            <span class="icon">✅</span>
            <h1>Aboneliğiniz Onaylandı!</h1>
            <p>Aramıza hoş geldiniz! Bundan sonra Yalova'daki en güncel gayrimenkul fırsatlarını email adresinize göndereceğiz.</p>
            <div class="email">${esc(result.email)}</div>
            <p style="font-size: 13px; color: #6b7280; margin-bottom: 20px;">
              📧 İlk bültenimizi bu hafta içinde alacaksınız.<br>
              📱 Bu arada bizi <a href="https://instagram.com/ismailunsal" style="color: #3b82f6;">Instagram</a>'dan da takip edebilirsiniz.
            </p>
            <a href="https://ismailunsal.com.tr" class="btn">🏠 İlanları İncele</a>
          `;
        } else {
          content.innerHTML = `
            <span class="icon">⚠️</span>
            <h1>Doğrulama Yapılamadı</h1>
            <p>${esc(result?.message || 'Bu link geçersiz veya zaten kullanılmış olabilir.')}</p>
            <p style="font-size: 13px; color: #6b7280;">
              Zaten doğrulanmış bir hesabınız olabilir. Ana sayfaya dönerek ilanları inceleyebilirsiniz.
            </p>
            <a href="https://ismailunsal.com.tr" class="btn btn-outline">Ana Sayfaya Dön</a>
          `;
        }
      } catch (err) {
        console.error('Verify error:', err);
        content.innerHTML = `
          <span class="icon">❌</span>
          <h1>Bir Hata Oluştu</h1>
          <p>${esc(err.message || 'Doğrulama sırasında bir hata oluştu. Lütfen daha sonra tekrar deneyin.')}</p>
          <a href="https://ismailunsal.com.tr" class="btn btn-outline">Ana Sayfaya Dön</a>
        `;
      }
    }
  </script>
</body>
</html>
